server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app calls /api/*; strip the prefix and forward to the API service. Serving
    # both from one origin is what keeps the browser out of CORS entirely.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Resume batches are large and screening is queued, not streamed.
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }
}
