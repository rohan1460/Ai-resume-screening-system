[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-screening"
version = "0.1.0"
description = "AI Resume Screening System"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "spacy>=3.8",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "structlog>=24.4",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "black>=24.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Autogenerated by Alembic; reformatting them obscures the diff against the models.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",
]
ignore = [
    "E501",  # line length is handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "no_stubs: opt out of the autouse embedding/storage doubles (see tests/conftest.py)",
    "real_storage: keep embeddings stubbed but hit a live MinIO/S3 (skipped if unreachable)",
]
